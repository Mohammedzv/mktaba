
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172554">
  <title>إدارة مكتبة قبضايا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body { background:#f1f5f9; }
    .admin-wrap { width:min(1100px,94%); margin:35px auto; }
    .admin-top { background:#172554; color:white; padding:25px; border-radius:18px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; }
    .admin-top h1 { font-size:23px; }
    .admin-top p { color:#cbd5e1; font-size:13px; }
    .admin-panel { background:white; padding:25px; border-radius:18px; box-shadow:var(--shadow); margin-bottom:25px; }
    .admin-panel h2 { color:#172554; margin-bottom:20px; font-size:20px; }
    .admin-form { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }
    .admin-form label { font-size:13px; font-weight:800; display:block; margin-bottom:6px; }
    .admin-form input,.admin-form select { width:100%; border:1px solid #dbe3ef; border-radius:10px; padding:12px; outline:none; background:#fff; }
    .admin-form input:focus,.admin-form select:focus { border-color:#2563eb; }
    .full { grid-column:1/-1; }
    .admin-btn { background:#2563eb; color:white; padding:12px 20px; border-radius:10px; font-weight:800; }
    .logout-btn { background:#dc2626; color:white; padding:10px 17px; border-radius:10px; font-weight:800; }
    .products-table { width:100%; border-collapse:collapse; min-width:600px; }
    .products-table th,.products-table td { padding:13px; border-bottom:1px solid #e2e8f0; text-align:right; font-size:13px; }
    .products-table th { background:#eff6ff; color:#172554; }
    .table-wrap { overflow-x:auto; }
    .action-btn { padding:7px 11px; border-radius:8px; font-size:12px; font-weight:800; margin:2px; }
    .edit-btn { background:#dbeafe; color:#1d4ed8; }
    .delete-btn { background:#fee2e2; color:#dc2626; }
    .status-message { padding:12px; border-radius:10px; margin-bottom:15px; display:none; font-size:13px; }
    .login-box { max-width:430px; margin:70px auto; background:white; padding:30px; border-radius:20px; box-shadow:var(--shadow); }
    .login-box h1 { color:#172554; margin-bottom:20px; }
    .login-box input { width:100%; padding:13px; border:1px solid #dbe3ef; border-radius:10px; margin:8px 0 15px; }
    .login-box button { width:100%; }
    .admin-hidden { display:none; }
    @media(max-width:600px) {
      .admin-form { grid-template-columns:1fr; }
      .full { grid-column:auto; }
      .admin-panel { padding:16px; }
    }
  </style>
</head>

<body>

  <!-- تسجيل دخول المدير -->
  <section class="login-box" id="loginSection">
    <div style="font-size:45px">📚</div>
    <h1>لوحة إدارة قبضايا</h1>
    <p>سجل دخولك بحساب المدير للمتابعة.</p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" required autocomplete="username" placeholder="البريد الإلكتروني">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="كلمة المرور">

      <button class="admin-btn" type="submit">تسجيل الدخول</button>
    </form>

    <div id="loginMessage" class="status-message"></div>
  </section>

  <!-- لوحة الإدارة -->
  <main class="admin-wrap admin-hidden" id="adminSection">

    <header class="admin-top">
      <div>
        <h1>📚 إدارة مكتبة قبضايا</h1>
        <p>إدارة المنتجات والمخزون</p>
      </div>

      <button class="logout-btn" id="logoutButton">تسجيل الخروج</button>
    </header>

    <section class="admin-panel">
      <h2 id="formTitle">➕ إضافة منتج جديد</h2>

      <div id="productMessage" class="status-message"></div>

      <form id="productForm" class="admin-form">

        <div>
          <label for="productName">اسم المنتج</label>
          <input id="productName" required maxlength="100" placeholder="مثال: كراسة 100 ورقة">
        </div>

        <div>
          <label for="productPrice">السعر بالجنيه</label>
          <input id="productPrice" type="number" min="0.01" step="0.01" required placeholder="مثال: 25">
        </div>

        <div>
          <label for="productCategory">القسم</label>
          <select id="productCategory" required>
            <option value="أدوات مدرسية">أدوات مدرسية</option>
            <option value="أدوات مكتبية">أدوات مكتبية</option>
            <option value="أدوات رسم">أدوات رسم</option>
            <option value="كراسات وكتب">كراسات وكتب</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>

        <div>
          <label for="productImage">رابط صورة المنتج</label>
          <input id="productImage" type="url" placeholder="https://example.com/image.jpg">
        </div>

        <div>
          <label for="productQuantity">الكمية المتاحة</label>
          <input id="productQuantity" type="number" min="0" step="1" value="1" required>
        </div>

        <div>
          <label for="productActive">حالة المنتج</label>
          <select id="productActive">
            <option value="true">ظاهر في المتجر</option>
            <option value="false">مخفي من المتجر</option>
          </select>
        </div>

        <div class="full" style="display:flex;gap:10px;flex-wrap:wrap">
          <button type="submit" class="admin-btn" id="saveButton">حفظ المنتج</button>
          <button type="button" class="action-btn edit-btn" id="cancelEdit" hidden>إلغاء التعديل</button>
        </div>

      </form>
    </section>

    <section class="admin-panel">
      <h2>📦 المنتجات المسجلة</h2>

      <div class="table-wrap">
        <table class="products-table">
          <thead>
            <tr>
              <th>اسم المنتج</th>
              <th>السعر</th>
              <th>القسم</th>
              <th>الكمية</th>
              <th>الحالة</th>
              <th>الإجراءات</th>
            </tr>
          </thead>

          <tbody id="adminProducts">
            <tr><td colspan="6">جاري تحميل المنتجات...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
